# Coleta a foto diaria dos metadados de cada repositorio.
#
# Job proprio, e diario, por um motivo so: stars, forks e issues abertas nao
# tem historico na API. O dia nao coletado esta perdido para sempre, ao
# contrario de commits, que a API guarda por 90 dias.

name: radar-snapshot-diario
description: >-
  Foto diaria dos metadados dos repositorios. Roda todo dia porque a API nao
  guarda historico dessas medidas: o dia nao coletado nao volta.

tags:
  projeto: radar
  criticidade: dado-irrecuperavel

# O job clona o repositorio a cada execucao, em vez de usar os notebooks do
# workspace. Em producao nao ha quem clique em Pull, e codigo divergente
# rodando em silencio ja custou tres rodadas de depuracao neste projeto
# (diario de bordo, entradas 18 e 19).
git_source:
  git_url: https://github.com/gabrielxal/radar-ecossistema-dados
  git_provider: gitHub
  git_branch: main

schedule:
  # segundo minuto hora dia-do-mes mes dia-da-semana
  # 0      0      9    todo dia    todo  qualquer      -> 9h da manha
  quartz_cron_expression: "0 0 9 * * ?"
  timezone_id: America/Sao_Paulo
  pause_status: UNPAUSED

max_concurrent_runs: 1

queue:
  enabled: true

tasks:
  - task_key: repositorios
    description: Coleta, bronze e silver do endpoint /repos/{repo}
    notebook_task:
      notebook_path: notebooks/07_repositorios
      source: GIT
      base_parameters:
        repos: ""
    timeout_seconds: 1800
    # Retentativa porque a tarefa toca a rede, e falha de API costuma ser
    # transitoria. Cinco minutos entre tentativas.
    max_retries: 2
    min_retry_interval_millis: 300000
    retry_on_timeout: false
