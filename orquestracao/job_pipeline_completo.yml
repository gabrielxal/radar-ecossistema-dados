# Pipeline inteiro, da ingestao aos fatos.
#
# Semanal, e nao diario, porque commit tem historico recuperavel na API: uma
# execucao perdida se conserta na seguinte. Rodar todo dia gastaria compute
# reprocessando o que a origem ainda guarda.
#
# Substitua SEU_EMAIL@exemplo.com antes de colar no Databricks. O endereco
# real fica de fora do repositorio de proposito: arquivo publico com e-mail
# dentro vira alvo de coleta automatizada.

resources:
  jobs:
    pipeline_completo_radar:
      name: pipeline-completo-radar

      schedule:
        # 9h30 de domingo
        quartz_cron_expression: 0 30 9 ? * SUN
        timezone_id: America/Fortaleza
        pause_status: UNPAUSED

      # Notificacao no job, e nao em cada tarefa: uma falha derruba as
      # seguintes por dependencia, e oito e-mails descrevendo o mesmo
      # incidente treinam qualquer um a ignorar o alerta.
      email_notifications:
        on_failure:
          - SEU_EMAIL@exemplo.com
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
        alert_on_last_attempt: true

      git_source:
        git_url: https://github.com/gabrielxal/radar-ecossistema-dados
        git_provider: gitHub
        git_branch: main

      queue:
        enabled: true

      max_concurrent_runs: 1

      # STANDARD e nao PERFORMANCE_OPTIMIZED: job semanal nao tem pressa, e o
      # modo economico gasta menos credito por execucao.
      performance_target: STANDARD

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"

      # As dependencias formam um DAG, nao uma fila:
      #
      #   ingestao_commits -> bronze_commits -> qualidade_bronze
      #                                      -> silver_commits -> qualidade_silver
      #   repositorios ------------------------------------------\
      #                                                dimensoes -> fatos
      #
      # `repositorios` nao depende de nada e roda em paralelo com a ingestao.
      # `dimensoes` espera as duas silvers, porque le de ambas.
      tasks:
        - task_key: ingestao_commits
          notebook_task:
            notebook_path: notebooks/02_ingestao
            source: GIT
            base_parameters:
              dias_historico: "90"
              limite_paginas: "5"
              repos: ""
          environment_key: Default
          # Retentativa so nas tarefas que tocam a rede. Falha de API e
          # transitoria; falha de logica repete igual cinco minutos depois.
          max_retries: 2
          min_retry_interval_millis: 300000

        - task_key: bronze_commits
          depends_on:
            - task_key: ingestao_commits
          notebook_task:
            notebook_path: notebooks/03_bronze
            source: GIT
            base_parameters:
              endpoint: commits
          environment_key: Default

        - task_key: qualidade_bronze
          depends_on:
            - task_key: bronze_commits
          notebook_task:
            notebook_path: notebooks/04_qualidade
            source: GIT
            base_parameters:
              endpoint: commits
          environment_key: Default

        - task_key: silver_commits
          depends_on:
            - task_key: bronze_commits
          notebook_task:
            notebook_path: notebooks/05_silver
            source: GIT
            base_parameters:
              endpoint: commits
          environment_key: Default

        - task_key: qualidade_silver
          depends_on:
            - task_key: silver_commits
          notebook_task:
            notebook_path: notebooks/06_qualidade_silver
            source: GIT
            base_parameters:
              endpoint: commits
          environment_key: Default

        - task_key: repositorios
          notebook_task:
            notebook_path: notebooks/07_repositorios
            source: GIT
            base_parameters:
              repos: ""
          environment_key: Default
          max_retries: 2
          min_retry_interval_millis: 300000

        - task_key: dimensoes
          depends_on:
            - task_key: silver_commits
            - task_key: repositorios
          notebook_task:
            notebook_path: notebooks/08_dimensoes
            source: GIT
          environment_key: Default

        - task_key: fatos
          depends_on:
            - task_key: dimensoes
          notebook_task:
            notebook_path: notebooks/09_fatos
            source: GIT
          environment_key: Default
