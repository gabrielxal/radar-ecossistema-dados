[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.1.0"
description = "Radar do ecossistema de engenharia de dados"
requires-python = ">=3.10"
dependencies = ["requests", "python-dotenv"]

[project.optional-dependencies]
# pyspark so para teste local: no Databricks o motor vem do cluster.
dev = ["pytest", "pyspark>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: exige sessao Spark local; sobe JVM"]